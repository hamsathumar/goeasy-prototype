<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoEasy Travels – Prototype</title>
<meta name="description" content="Clickable prototype of the GoEasy Travels booking platform: customer website, owner portal and admin dashboard. Data is saved in this browser only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --green:#06452e; --green-dark:#032d20; --green-mid:#0c6044;
  --gold:#d6ad50; --gold-light:#f7e6b0;
  --bg:#f3f5f1; --ink:#14231c; --muted:#5b6a62; --line:#dde3dc; --card:#fff;
  --blue:#1d5fbf; --blue-bg:#e5eefc; --purple:#6b3fb8; --purple-bg:#efe7fb;
  --lgreen:#2c7a4b; --lgreen-bg:#e3f3e8; --amber:#9a6200; --amber-bg:#fdf0d5;
  --red:#b42318; --red-bg:#fde7e4; --grey:#55615b; --grey-bg:#e9ece8;
  --radius:12px; --shadow:0 1px 2px rgba(20,35,28,.06),0 4px 16px rgba(20,35,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Outfit,Inter,sans-serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(28px,4.4vw,44px)} h2{font-size:24px} h3{font-size:18px} h4{font-size:15px}
p{margin:0 0 .8em}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.right{text-align:right} .center{text-align:center}
.row{display:flex;align-items:center;gap:12px} .row.wrapx{flex-wrap:wrap} .between{justify-content:space-between}
.stack>*+*{margin-top:12px} .stack-lg>*+*{margin-top:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep2,.g3.keep2{grid-template-columns:1fr 1fr}}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* demo bar */
.demo-bar{background:#0e1a15;color:#cfd8d2;font-size:13px}
.demo-bar .wrap{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;min-height:38px;padding-top:4px;padding-bottom:4px}
.demo-bar b{color:var(--gold-light);font-weight:600}
.demo-bar a,.demo-bar button{color:#fff;background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:none;font-size:13px}
.demo-bar a.on{color:var(--gold);text-decoration:underline;text-underline-offset:4px}
.demo-bar .sp{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid transparent;background:var(--green);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px;line-height:1.1;white-space:nowrap}
.btn:hover{background:var(--green-mid)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--green-dark)} .btn-gold:hover{background:#e2bd66}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)} .btn-ghost:hover{background:#f6f8f5}
.btn-danger{background:#fff;color:var(--red);border-color:#f1c2bc} .btn-danger:hover{background:var(--red-bg)}
.btn-wa{background:#1f8f4e} .btn-wa:hover{background:#18763f}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn-block{width:100%}
.link{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px;min-height:auto}

/* cards / fields */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
label.f .opt{font-weight:400;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #c9d2ca;border-radius:10px;background:#fff;font-size:16px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--green);outline:3px solid rgba(214,173,80,.55);outline-offset:0}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.err{color:var(--red);font-size:14px;font-weight:500}
.errbox{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 14px;font-weight:500}
.okbox{background:var(--lgreen-bg);color:var(--green);border-radius:10px;padding:10px 14px;font-weight:500}
.warnbox{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:10px 14px;font-weight:500}
.infobox{background:#eef3ee;border-radius:10px;padding:12px 14px}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding-top:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--green);flex:none}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-family:Outfit;font-weight:600;font-size:17px;margin-bottom:10px;padding:0}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.p-NEW{background:var(--blue-bg);color:var(--blue)}
.p-QUOTE_REQUESTED{background:var(--purple-bg);color:var(--purple)}
.p-CONFIRMED{background:var(--lgreen-bg);color:var(--lgreen)}
.p-ASSIGNED{background:var(--green);color:#fff}
.p-COMPLETED{background:var(--grey-bg);color:var(--grey)}
.p-CANCELLED{background:#f3f4f2;color:#8a948e;border-color:#e3e6e2}
.p-PENDING,.p-PENDING_VERIFICATION,.p-UPCOMING{background:var(--amber-bg);color:var(--amber)}
.p-APPROVED,.p-VERIFIED,.p-ACTIVE,.p-AVAILABLE,.p-DUE{background:var(--lgreen-bg);color:var(--lgreen)}
.p-REJECTED,.p-SUSPENDED,.p-EXPIRED{background:var(--red-bg);color:var(--red)}
.p-CHANGES_REQUESTED{background:var(--amber-bg);color:var(--amber)}
.p-INACTIVE,.p-UNAVAILABLE,.p-IN_MAINTENANCE{background:var(--grey-bg);color:var(--grey)}
.p-SOON{background:var(--amber-bg);color:var(--amber)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbf9;white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#f7faf6}
.tbl .right{text-align:right}
.tbl tr.past td{color:#7f8a84}

/* chips / tabs */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip .c{font-size:12px;background:rgba(0,0,0,.07);border-radius:999px;padding:0 7px}
.chip.on .c{background:rgba(255,255,255,.2)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:12px 14px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
.tab.on{color:var(--green);border-bottom-color:var(--gold)}

/* public */
.pub-head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.pub-head .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:40px;height:40px;flex:none}
.brand b{font-family:Outfit;font-size:19px;display:block;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted);display:block}
.pub-nav{display:flex;gap:4px;margin-left:auto}
.pub-nav button{background:none;border:0;padding:10px 12px;font-weight:500;cursor:pointer;color:var(--ink);border-radius:8px;min-height:44px}
.pub-nav button:hover{background:var(--bg)}
@media(max-width:900px){.pub-nav{display:none}.pub-head .btn{margin-left:auto}}
.hero{background:var(--green);color:#fff;position:relative;overflow:hidden}
.hero-scene{position:absolute;inset:auto 0 0 0;height:260px;pointer-events:none}
.hero-scene svg{width:100%;height:100%;display:block}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 470px;gap:40px;padding-top:48px;padding-bottom:72px;align-items:start}
@media(max-width:980px){.hero .wrap{grid-template-columns:1fr;padding-top:28px;padding-bottom:40px}.hero-scene{height:180px}}
.hero h1{color:#fff;max-width:560px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{font-size:17px;color:#d6e4dc;max-width:520px}
.ticks{list-style:none;padding:0;margin:18px 0 0}
.ticks li{display:flex;gap:10px;align-items:center;margin-bottom:10px;color:#eaf2ed}
.ticks svg{flex:none}
.widget{background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.wtabs{display:grid;grid-template-columns:repeat(3,1fr);background:#f1f4f0;border-bottom:1px solid var(--line)}
.wtabs button{border:0;background:none;padding:14px 6px;font-weight:600;cursor:pointer;color:var(--muted);min-height:52px;border-bottom:3px solid transparent;font-size:14px}
.wtabs button.on{background:#fff;color:var(--green);border-bottom-color:var(--gold)}
.wbody{padding:20px}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f4f0;border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:8px;min-height:40px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--green);box-shadow:var(--shadow)}
.fixed-loc{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#f1f4f0;font-weight:600}
.summary-line{background:#f1f4f0;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cls{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;min-height:84px}
.cls:hover:not([disabled]){border-color:var(--green)}
.cls.on{border-color:var(--green);background:#f3f9f5}
.cls[disabled]{opacity:.5;cursor:not-allowed}
.cls .pr{font-family:Outfit;font-weight:600;font-size:17px;text-align:right}
.cls .pr small{display:block;font-family:Inter;font-weight:500;font-size:12px;color:var(--muted)}
.pricebox{border:1px dashed #c6d2c8;border-radius:12px;padding:14px;background:#fbfcfa}
.pricebox .l{display:flex;justify-content:space-between;padding:3px 0}
.pricebox .l.t{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.section{padding:64px 0}
.section h2{font-size:clamp(24px,3vw,32px)}
.svc{display:flex;flex-direction:column;gap:8px}
.svc .ic{width:48px;height:48px;border-radius:12px;background:var(--gold-light);display:grid;place-items:center;color:var(--green)}
.soon{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:#fff;border:1px dashed #c3ccc4;color:var(--muted);font-size:14px}
.soon small{font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-bg);border-radius:999px;padding:1px 8px}
.stepn{width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--gold);display:grid;place-items:center;font-family:Outfit;font-weight:600;font-size:18px}
.cta{background:var(--green-dark);color:#fff;border-radius:20px;padding:36px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta h2{color:#fff}
.foot{background:var(--green-dark);color:#c4d3ca;padding:40px 0 28px;font-size:14px}
.foot h4{color:#fff}
.foot a{color:#fff}

/* seat map */
.seatmap{border:1.5px solid var(--line);border-radius:18px 18px 10px 10px;padding:12px;background:#fafbf9;max-width:260px;margin:0 auto}
.seatmap .front{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
.seatmap .drv{width:44px;height:44px;border-radius:10px;background:var(--grey-bg);display:grid;place-items:center;font-size:11px;font-weight:600}
.seatrow{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.seat{width:48px;height:48px;border-radius:10px 10px 6px 6px;border:1.5px solid #b9c7bc;background:#fff;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.seat:hover:not([disabled]){border-color:var(--green)}
.seat.sel{background:var(--gold);border-color:#b8902f;color:var(--green-dark)}
.seat[disabled],.seat.taken{background:#e6e9e5;color:#9aa39d;border-color:#dde1dc;cursor:not-allowed;text-decoration:line-through}
.seat.taken.named{text-decoration:none;cursor:help}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #b9c7bc;vertical-align:-2px;margin-right:4px}

/* confirmation / ticket */
.bigtick{width:72px;height:72px;border-radius:50%;background:var(--lgreen-bg);display:grid;place-items:center;margin:0 auto 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.ticket{max-width:720px;margin:24px auto;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.ticket-head{background:var(--green);color:#fff;padding:22px 26px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.ticket-head h2{color:#fff;margin:0}
.ticket-head .mark{width:48px;height:48px;flex:none}
.ticket-body{padding:24px 26px;display:grid;grid-template-columns:1fr 160px;gap:24px}
@media(max-width:600px){.ticket-body{grid-template-columns:1fr}}
@media print{
  .noprint,.demo-bar,.pub-head,.foot{display:none!important}
  body{background:#fff}
  .ticket{border:0;margin:0;max-width:none}
  .ticket-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .admin .side{display:none!important}
  .admin{display:block!important} .admin .main{padding:0!important}
  .tbl-wrap{overflow:visible!important}
}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:225px;margin-top:8px}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .col{width:100%;max-width:56px;background:var(--green);border-radius:6px 6px 0 0;min-height:2px}
.bars .b.cur .col{background:var(--gold)}
.bars .val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .lab{font-size:12px;font-weight:600}
.msg-sent{color:var(--green);font-size:13px;font-weight:600}

/* partner */
.p-head{background:var(--green-dark);color:#fff}
.p-head .wrap{display:flex;align-items:center;gap:12px;min-height:64px;max-width:980px}
.p-head .brand{color:#fff} .p-head .brand span{color:#a9c0b3}
.p-head .who{margin-left:auto;text-align:right;font-size:13px;color:#cfe0d6}
.p-head .who b{color:#fff;display:block;font-size:14px}
.p-main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.banner{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.amber{background:var(--amber-bg);color:#6e4700}
.banner.red{background:var(--red-bg);color:var(--red)}
.banner.green{background:var(--lgreen-bg);color:var(--green)}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.tile .v{font-family:Outfit;font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.moneybox{background:#f6f8f5;border-radius:10px;padding:10px 12px;font-size:14px}
.moneybox .l{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.vcard{display:grid;grid-template-columns:120px 1fr;gap:14px}
@media(max-width:520px){.vcard{grid-template-columns:1fr}}
.thumb{width:100%;aspect-ratio:4/3;border-radius:10px;background:#e8ede7;object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img,.thumbs .ph{width:84px;height:64px;object-fit:cover;border-radius:8px;background:#e8ede7}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border:0}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.dot.ok{background:var(--lgreen-bg);color:var(--green)} .dot.no{background:var(--grey-bg);color:var(--grey)}

/* admin */
.admin{display:grid;grid-template-columns:244px 1fr;min-height:calc(100vh - 38px)}
.side{background:var(--green-dark);color:#cfe0d6;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:calc(100vh - 38px);overflow-y:auto}
.side .brand{color:#fff;padding:0 8px 16px} .side .brand span{color:#a9c0b3}
.side a.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:#dce9e1;text-decoration:none;font-weight:500;min-height:44px}
.side a.nav:hover{background:rgba(255,255,255,.07)}
.side a.nav.on{background:var(--green-mid);color:#fff}
.side .badge{background:var(--gold);color:var(--green-dark);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:13px}
.main{padding:24px 28px 60px;min-width:0}
.ph-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph-row h1{font-size:26px;margin:0}
@media(max-width:900px){
  .admin{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px}
  .side .brand,.side .me{display:none}
  .side a.nav{white-space:nowrap;flex:none}
  .main{padding:18px 16px 60px}
}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .v{font-family:Outfit;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted)}
.actions-list a{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);align-items:center;min-height:44px}
.actions-list a:last-child{border:0}
.actions-list a:hover{background:#f7faf6}
.actions-list .n{font-family:Outfit;font-weight:600;font-size:18px;min-width:36px;text-align:center;border-radius:8px;background:var(--gold-light);color:var(--green-dark);padding:2px 8px}
.flow{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.flow span{flex:1;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
.flow span:last-child{border:0}
.flow span.done{color:var(--green);background:#f3f9f5}
.flow span.cur{color:#fff;background:var(--green)}
.flow span.x{color:var(--red);background:var(--red-bg)}
.bd{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.bd .t{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:4px}
.cal button{min-height:72px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13px}
.cal button.out{opacity:.4}
.cal button.today{border-color:var(--gold);border-width:2px}
.cal button .c{font-size:12px;background:var(--lgreen-bg);color:var(--green);border-radius:6px;padding:1px 6px;align-self:flex-start;font-weight:600}
.hist li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.hist{list-style:none;padding:0;margin:0}

/* modal / toast */
dialog{border:0;border-radius:16px;padding:0;max-width:min(480px,calc(100vw - 32px));width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,15,.5)}
dialog .mb{padding:22px}
dialog .mf{padding:14px 22px;background:#f6f8f5;display:flex;justify-content:flex-end;gap:10px}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;justify-content:space-between}
.toast.error{background:var(--red)}
.toast a{color:var(--gold-light);font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.notice{background:var(--gold-light);color:#5a4511;border-radius:10px;padding:10px 14px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="modal"></dialog>
<script>
/* =====================================================================
   GoEasy Travels – single-file prototype.
   Visual and flow reference only. Data lives in this browser (localStorage).
   The real app is Next.js + Postgres (see CLAUDE.md).
   ===================================================================== */
'use strict';

/* ---------- config ---------- */
const TZ = 'Asia/Colombo';
const PAYHERE_ENABLED = false; // card option hidden until PayHere is set up
const CLASSES = {
  CAR: { label: 'Car', max: 3, desc: 'Toyota Axio, Prius or similar' },
  VAN: { label: 'Van', max: 9, desc: 'Toyota Hiace, Dolphin or similar' },
  KDH: { label: 'KDH High Roof', max: 12, desc: 'Toyota KDH High Roof, more luggage space' },
};
const COUNTRIES = ['Sri Lanka','Qatar','UAE','Saudi Arabia','Kuwait','Oman','Bahrain','Maldives','India','Singapore','Malaysia','UK','USA','Canada','Australia','New Zealand','Japan','South Korea','Germany','France','Italy','Switzerland','Russia','Turkey','Jordan','Lebanon','Egypt','South Africa','Bangladesh','Pakistan','Nepal','Other'];
const STATUS_LABEL = { NEW:'New', QUOTE_REQUESTED:'Quote requested', CONFIRMED:'Confirmed', ASSIGNED:'Assigned', COMPLETED:'Completed', CANCELLED:'Cancelled',
  PENDING:'Pending', APPROVED:'Approved', CHANGES_REQUESTED:'Changes requested', REJECTED:'Rejected',
  ACTIVE:'Active', INACTIVE:'Inactive', SUSPENDED:'Suspended', AVAILABLE:'Available', UNAVAILABLE:'Unavailable', IN_MAINTENANCE:'In maintenance',
  PENDING_VERIFICATION:'Pending verification', VERIFIED:'Verified', UPCOMING:'Upcoming', DUE:'Due', EXPIRED:'Expired', SOON:'Expiring soon' };
const MODE_LABEL = { MIXED:'Mixed (advance to GoEasy, balance to driver)', OWNER_COLLECTS_ALL:'Owner collects all', GOEASY_COLLECTS_ALL:'GoEasy collects all' };
const MODE_SHORT = { MIXED:'Mixed', OWNER_COLLECTS_ALL:'Owner collects all', GOEASY_COLLECTS_ALL:'GoEasy collects all' };
const SOURCE_LABEL = { WEBSITE:'Website', PHONE:'Phone', WHATSAPP:'WhatsApp', WALK_IN:'Walk-in' };
const DOC_LABEL = { NIC:'NIC copy', DRIVING_LICENCE:'Driving licence', VEHICLE_REGISTRATION:'Vehicle registration (CR)', INSURANCE:'Insurance certificate', REVENUE_LICENCE:'Revenue licence', OTHER:'Other' };
const KIND_LABEL = { AIRPORT:'Airport pickup & drop', PRIVATE:'Private vehicle hire', SEAT:'Sharing van seat' };

/* ---------- small utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function randToken() {
  const a = new Uint8Array(18); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function nowLocal() { // current Asia/Colombo time as 'YYYY-MM-DDTHH:mm'
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
const today = () => nowLocal().slice(0, 10);
function addDays(d, n) { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
const toMin = local => Date.parse(local + ':00Z') / 60000; // all business times are Colombo wall-clock strings
function fmtDate(d) { if (!d) return ''; const x = new Date(d.slice(0, 10) + 'T00:00:00Z'); return `${x.getUTCDate()} ${MONTHS[x.getUTCMonth()]} ${x.getUTCFullYear()}`; }
function fmtDay(d) { const x = new Date(d.slice(0, 10) + 'T00:00:00Z'); return `${DAYS[x.getUTCDay()]} ${x.getUTCDate()} ${MONTHS[x.getUTCMonth()]}`; }
function fmtTime(t) { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; }
const fmtDT = l => `${fmtDay(l)}, ${fmtTime(l.slice(11, 16))}`;
function fmtStamp(iso) { const d = new Date(iso); return d.toLocaleString('en-GB', { timeZone: TZ, day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true }); }
const rs = n => 'Rs. ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const pill = s => `<span class="pill p-${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
const monthKey = d => d.slice(0, 7);

/* phone: 0771234567 -> 94771234567, +974 5555 1234 -> 97455551234 */
function normPhone(p) {
  const raw = String(p || '').trim();
  let d = raw.replace(/\D/g, '');
  if (raw.startsWith('+')) return d;
  if (d.startsWith('00')) return d.slice(2);
  if (d.length === 10 && d.startsWith('0')) return '94' + d.slice(1);
  if (d.length === 9 && d.startsWith('7')) return '94' + d;
  return d;
}
const phoneOk = n => /^\d{9,15}$/.test(n);
function showPhone(n) {
  if (!n) return '';
  if (/^94\d{9}$/.test(n)) { const l = '0' + n.slice(2); return `${l.slice(0, 3)} ${l.slice(3, 6)} ${l.slice(6)}`; }
  return '+' + n;
}
const roundTo100 = x => Math.round(x / 100) * 100;

/* ---------- money (mirrors src/lib/money.ts, CLAUDE.md 9.8) ---------- */
function computeMoney({ total, advance, hire, internal, type, value, mode }) {
  const commission = internal ? 0 : type === 'PERCENT' ? Math.round(hire * value / 100) : value;
  const ownerShare = hire - commission;
  const ownerCollects = mode === 'OWNER_COLLECTS_ALL' ? total : mode === 'GOEASY_COLLECTS_ALL' ? 0 : Math.max(total - advance, 0);
  const goeasyReceives = total - ownerCollects;
  const settlement = internal ? 0 : ownerShare - ownerCollects;
  const goeasyEarns = internal ? total : total - hire + commission;
  return { commission, ownerShare, ownerCollects, goeasyReceives, settlement, goeasyEarns };
}
function moneyErrors({ hire, internal, type, value }) {
  const e = [];
  if (!Number.isInteger(hire) || hire <= 0) e.push('Hire amount must be more than 0.');
  if (!internal) {
    if (!Number.isInteger(value) || value < 0) e.push('Commission must be a whole number, 0 or more.');
    else if (type === 'PERCENT' && value > 100) e.push('Percent commission must be between 0 and 100.');
    else if (type === 'FIXED' && value > hire) e.push('Fixed commission cannot be more than the hire amount.');
  }
  return e;
}
const advanceFor = total => roundTo100(total * S.settings.advancePercent / 100);

/* ---------- store ---------- */
const KEY = 'goeasy-prototype-v1', SKEY = 'goeasy-prototype-session';
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 1) { S = seed(); save(); }
  S.messages ||= [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) {
    if (/quota/i.test(e.name + e.message)) toast('Browser storage is full. Remove some photos or reset the demo data.', 'error');
    else if (!save.warned) { save.warned = true; toast('This browser blocks storage, so changes are lost when you reload.', 'error'); }
  }
}
function nextCode(name) {
  S.counters[name] = (S.counters[name] || 0) + 1;
  const v = S.counters[name];
  return { booking: 'AMS-' + v, seat: 'SEAT-' + v, owner: 'OW-' + String(v).padStart(3, '0'), payment: 'PAY-' + String(v).padStart(3, '0') }[name];
}
function audit(action, entity, entityId, text) {
  S.audit.unshift({ id: uid(), at: new Date().toISOString(), actor: currentUser()?.name || 'Customer', action, entity, entityId, text });
}
const getSession = () => { try { return JSON.parse(localStorage.getItem(SKEY)) || null; } catch (e) { return null; } };
const setSession = s => { try { s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); } catch (e) {} };
function currentUser() { const s = getSession(); return s ? S.users.find(u => u.id === s.userId) || null : null; }

/* lookups */
const loc = id => S.locations.find(l => l.id === id);
const locName = id => loc(id)?.name || '–';
const ownerById = id => S.owners.find(o => o.id === id);
const vehicleById = id => S.vehicles.find(v => v.id === id);
const customerById = id => S.customers.find(c => c.id === id);
const scheduleById = id => S.schedules.find(s => s.id === id);
const internalOwner = () => S.owners.find(o => o.isInternal);
const ownerVehicles = oid => S.vehicles.filter(v => v.ownerId === oid);
const ownerForUser = u => u && S.owners.find(o => o.userId === u.id);
const isActiveOwner = o => o && o.approval === 'APPROVED' && o.status === 'ACTIVE';

/* ---------- pricing (mirrors src/lib/pricing.ts) ---------- */
function findRoute(fromId, toId) {
  return S.prices.find(p => p.active && ((p.fromId === fromId && p.toId === toId) || (p.fromId === toId && p.toId === fromId)));
}
function priceFor(fromId, toId, cls) {
  const r = findRoute(fromId, toId); if (!r) return null;
  const v = r[cls.toLowerCase()]; return Number.isInteger(v) && v > 0 ? v : null;
}

/* ---------- expiry ---------- */
function expiryState(d) {
  if (!d) return null; const n = daysBetween(today(), d);
  if (n < 0) return 'EXPIRED'; if (n <= 30) return 'SOON'; return null;
}
function vehicleExpiry(v) {
  const out = [];
  [['Insurance', v.insuranceExpiry], ['Revenue licence', v.licenceExpiry]].forEach(([k, d]) => {
    const s = expiryState(d); if (s) out.push({ k, d, s, text: s === 'EXPIRED' ? `${k} expired on ${fmtDate(d)}` : `${k} expires on ${fmtDate(d)} (${daysBetween(today(), d)} days)` });
  });
  return out;
}

/* ---------- clash check (mirrors src/lib/clash.ts, CLAUDE.md 9.9) ---------- */
function clashCheck({ bookingId, ownerId, vehicleId, pickupAt, passengers }) {
  const blocks = [], warnings = [], W = S.settings.clashWindow;
  const o = ownerById(ownerId), v = vehicleById(vehicleId);
  if (!o || o.approval !== 'APPROVED' || o.status !== 'ACTIVE') blocks.push('This owner is not approved and active.');
  if (!v) { blocks.push('Choose a vehicle.'); return { blocks, warnings }; }
  if (v.approval !== 'APPROVED') blocks.push('This vehicle is not approved.');
  if (v.availability !== 'AVAILABLE') blocks.push(`This vehicle is marked ${STATUS_LABEL[v.availability].toLowerCase()}.`);
  if (passengers && v.seats < passengers + 1) warnings.push(`Vehicle has ${v.seats} seats. Trip needs ${passengers} passengers + driver.`);
  const t = toMin(pickupAt);
  for (const b of S.bookings) {
    if (b.id === bookingId || b.status === 'CANCELLED' || !b.assignment) continue;
    const d = Math.abs(toMin(b.pickupAt) - t); if (d >= W) continue;
    if (b.assignment.vehicleId === vehicleId) blocks.push(`Same vehicle is on ${b.code} at ${fmtTime(b.pickupAt.slice(11))} (${d} min apart).`);
    else if (b.assignment.ownerId === ownerId) warnings.push(`Same owner has ${b.code} at ${fmtTime(b.pickupAt.slice(11))} with ${vehicleById(b.assignment.vehicleId)?.regNo}. Check they have a driver for both.`);
  }
  const date = pickupAt.slice(0, 10);
  for (const s of S.schedules) {
    if (!s.active || s.vehicleId !== vehicleId) continue;
    for (const dd of [addDays(date, -1), date, addDays(date, 1)]) {
      const d = Math.abs(toMin(dd + 'T' + s.time) - t);
      if (d < W) blocks.push(`Vehicle runs the ${s.fromTown} to ${s.toTown} sharing van at ${fmtTime(s.time)} on ${fmtDay(dd)}.`);
    }
  }
  vehicleExpiry(v).forEach(x => warnings.push(x.text + '.'));
  return { blocks, warnings };
}

/* ---------- sharing van seats ---------- */
function seatRows(n) {
  if (n === 10) return [3, 3, 4];
  if (n === 13) return [3, 3, 3, 4];
  const r = []; let left = n; while (left > 0) { r.push(Math.min(3, left)); left -= 3; } return r;
}
const seatCount = sch => vehicleById(sch.vehicleId)?.seats || 10;
function seatTakenMap(scheduleId, date) {
  const m = {};
  S.seatBookings.filter(b => b.scheduleId === scheduleId && b.date === date && b.status !== 'CANCELLED')
    .forEach(b => b.seats.forEach(n => { m[n] = b; }));
  return m;
}
const seatsLeft = (sch, date) => seatCount(sch) - Object.keys(seatTakenMap(sch.id, date)).length;
function seatMapHtml(sch, date, selected = [], opts = {}) {
  const taken = seatTakenMap(sch.id, date); let n = 0;
  const rows = seatRows(seatCount(sch)).map(cnt => {
    let cells = '';
    for (let i = 0; i < cnt; i++) {
      n++; const t = taken[n], sel = selected.includes(n);
      if (t) cells += opts.admin
        ? `<button type="button" class="seat taken named" title="${esc(t.contactName)} · ${esc(t.code)}" aria-label="Seat ${n}, taken by ${esc(t.contactName)}" disabled>${n}</button>`
        : `<button type="button" class="seat taken" aria-label="Seat ${n}, taken" disabled>${n}</button>`;
      else cells += `<button type="button" class="seat ${sel ? 'sel' : ''}" ${opts.readonly ? 'disabled' : ''} data-act="${opts.act || 'pickSeat'}" data-seat="${n}" aria-pressed="${sel}" aria-label="Seat ${n}, ${sel ? 'selected' : 'free'}">${n}</button>`;
    }
    return `<div class="seatrow">${cells}</div>`;
  }).join('');
  return `<div class="seatmap"><div class="front"><span>Front</span><span class="drv" aria-label="Driver">Driver</span></div>${rows}</div>
  <div class="legend"><span><i></i>Free</span><span><i style="background:var(--gold);border-color:#b8902f"></i>Your pick</span><span><i style="background:#e6e9e5"></i>Taken</span></div>`;
}

/* ---------- settlement (mirrors src/lib/settlement.ts, CLAUDE.md 9.14) ---------- */
function ownerLines(ownerId) {
  return S.bookings.filter(b => b.assignment && b.assignment.ownerId === ownerId && b.status !== 'CANCELLED')
    .map(b => ({ b, a: b.assignment, state: b.status === 'COMPLETED' ? 'DUE' : 'UPCOMING' }))
    .sort((x, y) => y.b.pickupAt.localeCompare(x.b.pickupAt));
}
function ownerBalance(ownerId) {
  const due = ownerLines(ownerId).filter(l => l.state === 'DUE').reduce((s, l) => s + l.a.settlement, 0);
  const pays = S.payments.filter(p => p.ownerId === ownerId);
  const ver = d => pays.filter(p => p.status === 'VERIFIED' && p.direction === d).reduce((s, p) => s + p.amount, 0);
  const pend = d => pays.filter(p => p.status === 'PENDING_VERIFICATION' && p.direction === d).reduce((s, p) => s + p.amount, 0);
  const balance = due + ver('OWNER_TO_GOEASY') - ver('GOEASY_TO_OWNER');
  return { balance, pendingIn: pend('OWNER_TO_GOEASY'), pendingOut: pend('GOEASY_TO_OWNER') };
}
function balanceText(bal, forOwner) {
  if (bal < 0) return forOwner ? `You owe GoEasy ${rs(-bal)}` : `Owner owes GoEasy ${rs(-bal)}`;
  if (bal > 0) return forOwner ? `GoEasy owes you ${rs(bal)}` : `GoEasy owes owner ${rs(bal)}`;
  return 'Settled';
}
const settleText = (n, forOwner) => n > 0 ? (forOwner ? `GoEasy pays you ${rs(n)}` : `GoEasy pays owner ${rs(n)}`) : n < 0 ? (forOwner ? `You pay GoEasy ${rs(-n)}` : `Owner pays GoEasy ${rs(-n)}`) : 'Nothing to settle';

/* ---------- WhatsApp + e-ticket (mirrors whatsapp.ts / eticket.ts) ---------- */
const waLink = (digits, text) => `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
const goeasyWa = () => normPhone(S.settings.company.whatsapp);
function eticketText(x) {
  const seat = x.kind === 'SEAT';
  const quote = !seat && (x.priceType === 'QUOTE');
  let vehicleLine;
  if (seat) vehicleLine = `Seat number: ${x.seats.join(', ')}`;
  else { const v = x.assignment && vehicleById(x.assignment.vehicleId); vehicleLine = `Vehicle: ${CLASSES[x.cls].label}${v ? ` (${v.regNo})` : ''}`; }
  const date = seat ? x.date : x.pickupAt.slice(0, 10), time = seat ? scheduleById(x.scheduleId)?.time : x.pickupAt.slice(11, 16);
  return [
    '*AMS TOURS LANKA (PVT) LTD*', 'GOEASY TRAVELS – E-TICKET', '',
    `Booking ID: ${x.code}`, `Customer: ${x.contactName}`, `Phone: ${showPhone(x.contactPhone)}`,
    `Service: ${KIND_LABEL[seat ? 'SEAT' : x.kind]}`,
    `From: ${seat ? x.pickupTown : locName(x.fromId)}`, `To: ${seat ? x.dropTown : locName(x.toId)}`,
    `Travel date: ${fmtDate(date)}`, `Travel time: ${fmtTime(time)}`, vehicleLine,
    `Passengers: ${seat ? x.seats.length : x.pax}`,
    `Total amount: ${quote ? 'To be confirmed' : rs(x.total)}`,
    `Advance: ${quote ? 'To be confirmed' : `${rs(x.advance)} (${x.advancePaidAt ? 'paid' : 'due'})`}`,
    `Balance: ${quote ? 'To be confirmed' : rs(x.total - (x.advancePaidAt ? x.advance : 0))}`, '',
    'Thank you for choosing GOEASY TRAVELS.', 'Your Trusted Travel Partner.'
  ].join('\n');
}
function ownerTripText(b) {
  const a = b.assignment, v = vehicleById(a.vehicleId);
  return [`*GoEasy trip ${b.code}*`, `Date: ${fmtDate(b.pickupAt)}`, `Time: ${fmtTime(b.pickupAt.slice(11))}`,
    `From: ${locName(b.fromId)}`, `To: ${locName(b.toId)}`, `Passengers: ${b.pax}`, `Vehicle: ${v?.regNo || ''}`,
    `Customer: ${b.contactName}, ${showPhone(b.contactPhone)}`, `Collect from customer: ${rs(a.ownerCollects)}`,
    b.notes ? `Notes: ${b.notes}` : null, '– GoEasy Travels'].filter(Boolean).join('\n');
}
function quoteText(b) {
  return `Hello ${b.contactName}, thank you for your request ${b.code}.\n${locName(b.fromId)} to ${locName(b.toId)}, ${fmtDT(b.pickupAt)}, ${CLASSES[b.cls].label}.\nPrice: ${rs(b.total)}. Advance to confirm: ${rs(b.advance)}.\n\n${S.settings.bankDetails}\n\nView your booking: ${appUrl('booking/' + b.token)}\nQuotation: ${appUrl('booking/' + b.token + '/quote')}\n– GoEasy Travels`;
}
const appUrl = path => location.href.split('#')[0] + '#/' + path;

/* ---------- UI helpers ---------- */
function toast(msg, type = '', link) {
  const el = document.createElement('div'); el.className = 'toast ' + type;
  el.innerHTML = `<span>${esc(msg)}</span>${link ? `<a href="${esc(link.href)}" target="_blank" rel="noopener">${esc(link.text)}</a>` : ''}`;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), link ? 9000 : 4000);
}
function modal({ title, body = '', ok = 'OK', danger = false, reason = false, reasonLabel = 'Reason', cancel = 'Cancel' }) {
  return new Promise(res => {
    const d = $('#modal');
    d.innerHTML = `<form method="dialog"><div class="mb"><h3>${esc(title)}</h3>${body ? `<div class="muted">${body}</div>` : ''}
      ${reason ? `<div style="margin-top:12px"><label class="f" for="m-reason">${esc(reasonLabel)}</label><textarea class="input" id="m-reason" required></textarea><div class="err hide" id="m-err">Please write a reason.</div></div>` : ''}
      </div><div class="mf">${cancel ? `<button class="btn btn-ghost" value="cancel" type="button" id="m-cancel">${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'btn-danger' : ''}" value="ok" id="m-ok">${esc(ok)}</button></div></form>`;
    const done = v => { d.close(); res(v); };
    $('#m-cancel', d)?.addEventListener('click', () => done({ ok: false }));
    $('form', d).addEventListener('submit', e => {
      e.preventDefault();
      const r = reason ? $('#m-reason', d).value.trim() : '';
      if (reason && !r) { $('#m-err', d).classList.remove('hide'); return; }

  };
  mkS(c3, 'sch-1', T, [1, 2], { status: 'CONFIRMED', advancePaidAt: now });
  mkS(c7, 'sch-1', T, [5], { pickupTown: 'Nintavur' });

  pay({ ownerId: 'o-rizwan', direction: 'OWNER_TO_GOEASY', amount: 2000, reference: 'BOC 448812', paidOn: D(-2), status: 'VERIFIED' });
  pay({ ownerId: 'o-rizwan', direction: 'OWNER_TO_GOEASY', amount: 1500, method: 'CASH', reference: '', paidOn: D(-1), status: 'PENDING_VERIFICATION', note: 'Paid at the office' });

  return {
    v: 1,
    settings: {
      company: { name: 'AMS TOURS LANKA (PVT) LTD', brand: 'GoEasy Travels', reg: 'PV 00283916', phone: '076 477 5761', whatsapp: '075 283 5761', email: 'info@goeasy.lk', website: 'www.goeasy.lk', address: 'Akkaraipattu, Sri Lanka', tagline: 'Your Trusted Travel Partner.' },
      advancePercent: 25, seatPrice: 3500, clashWindow: 120, samplePrices: true,
      bankDetails: 'Bank: [Bank name – to be added]\nAccount name: AMS Tours Lanka (Pvt) Ltd\nAccount no.: [to be added]\nBranch: [to be added]\nPlease send the slip to us on WhatsApp.',
    },
    locations, prices, users, owners, vehicles, customers, bookings, schedules, seatBookings, payments, counters,
    audit: [{ id: uid(), at: now, actor: 'System', action: 'seed', entity: 'system', entityId: '-', text: 'Demo data created.' }],
  };
}

/* ---------- router ---------- */
let R = { path: [], q: {} };
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [p, qs] = h.split('?');
  R = { path: p.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
const go = h => { if (location.hash === '#/' + h) render(); else location.hash = '/' + h; };
function render() {
  parseHash();
  const [a] = R.path; let html, after;
  try {
    if (a === 'partner') ({ html, after } = partnerRoute());
    else if (a === 'admin') ({ html, after } = adminRoute());
    else ({ html, after } = publicRoute());
  } catch (e) { console.error(e); html = `<div class="wrap section"><div class="errbox">Something went wrong: ${esc(e.message)}</div></div>`; }
  $('#app').innerHTML = demoBar() + html;
  if (after) after();
  if (!R.keepScroll) window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY; R.keepScroll = true; $('#app').innerHTML = ''; render(); window.scrollTo(0, y); R.keepScroll = false; }
function demoBar() {
  const a = R.path[0], side = a === 'partner' ? 'p' : a === 'admin' ? 'a' : 'c';
  return `<div class="demo-bar noprint"><div class="wrap"><b>Prototype</b><span>Data is saved in this browser only.</span><span class="sp"></span>
    <a href="#/" class="${side === 'c' ? 'on' : ''}">Customer website</a>
    <a href="#/partner" class="${side === 'p' ? 'on' : ''}">Owner portal</a>
    <a href="#/admin" class="${side === 'a' ? 'on' : ''}">Admin dashboard</a>
    <button data-act="resetDemo">Reset demo data</button></div></div>`;
}

/* ---------- event delegation ---------- */
const ACT = {}, FORM = {}, LIVE = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = FORM[f.dataset.form]; if (fn) fn(f, formData(f));
});
['input', 'change'].forEach(t => document.addEventListener(t, e => {
  const el = e.target.closest('[data-live]'); if (el && LIVE[el.dataset.live]) LIVE[el.dataset.live](el, e);
}));
ACT.go = el => go(el.dataset.to);
ACT.resetDemo = async () => {
  const r = await modal({ title: 'Reset demo data?', body: 'All bookings, owners and changes made in this browser will be replaced with fresh demo data.', ok: 'Reset', danger: true });
  if (!r.ok) return; localStorage.removeItem(KEY); setSession(null); W = freshWidget(); load(); go(''); toast('Demo data reset.');
};
ACT.signOut = () => { const a = R.path[0]; setSession(null); go(a === 'admin' ? 'admin/login' : 'partner/login'); };
ACT.copy = el => { navigator.clipboard?.writeText(el.dataset.text).then(() => toast('Copied.'), () => toast('Could not copy. Select the text instead.', 'error')); };
ACT.print = () => window.print();
</script>
<script>

function freshWidget() {

let W = freshWidget();

    <div><h4>More</h4><p><a href="#/partner/register">Partner with us</a><br><a href="#/terms">Terms</a> · <a href="#/privacy">Privacy</a> · <a href="#/partner-terms">Partner terms</a></p><p class="small">${esc(c.website)}</p></div>
  </div></footer>`;

ACT.scrollTo = el => {

};

function homePage() {
  const svc = (ic, t, d, tab) => `<div class="card svc"><div class="ic">${ic}</div><h3>${t}</h3><p class="muted">${d}</p><div><button class="btn btn-sm" data-act="wTab" data-tab="${tab}" data-scroll="1">Book now</button></div></div>`;

  <section class="section" id="partner"><div class="wrap"><div class="cta"><div><h2>Own a van or car? Earn with GoEasy.</h2><p style="color:#c4d3ca;max-width:560px;margin:0">Register your vehicle, get airport and private trips from us, and see your trips and earnings on your phone.</p></div>
    <a class="btn btn-gold" href="#/partner/register">Register as a partner</a></div></div></section>`;
}

/* ---------- booking widget ---------- */
const activeLocs = () => S.locations.filter(l => l.active && l.bookable !== false).sort((a, b) => a.sortOrder - b.sortOrder);
const seatTowns = () => S.locations.filter(l => l.active && l.isSeatTown).sort((a, b) => a.sortOrder - b.sortOrder).map(l => l.name);
function wTrip() {
  if (W.tab === 'AIRPORT') return W.dir === 'PICKUP' ? { fromId: 'loc-bia', toId: W.town } : { fromId: W.town, toId: 'loc-bia' };
  return { fromId: W.from, toId: W.to };
}
function widgetHtml() {
  const tabs = [['AIRPORT', 'Airport transfer'], ['PRIVATE', 'Private hire'], ['SEAT', 'Sharing van seat']];
  const nSteps = W.tab === 'SEAT' ? 2 : 3, cur = W.tab === 'SEAT' && W.step === 3 ? 2 : W.step;
  let body;
  if (W.step === 1) body = W.tab === 'SEAT' ? wSeatStep() : wTripStep();
  else if (W.step === 2) body = wClassStep();
  else body = wDetailsStep();
  return `<div class="wtabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${W.tab === k}" class="${W.tab === k ? 'on' : ''}" data-act="wTab" data-tab="${k}">${l}</button>`).join('')}</div>
   <div class="wbody"><div class="steps" aria-label="Step ${cur} of ${nSteps}">${Array.from({ length: nSteps }, (_, i) => `<span class="${i < cur ? 'on' : ''}"></span>`).join('')}</div>
   ${W.err ? `<div class="errbox" role="alert" style="margin-bottom:12px">${esc(W.err)}</div>` : ''}${body}</div>`;
}
function wTripStep() {
  const locs = activeLocs(), nonAir = locs.filter(l => !l.isAirport);
  const sel = (name, val, list, ph) => `<select class="input" name="${name}" data-live="w">${ph ? `<option value="">${ph}</option>` : ''}${list.map(l => opt(l.id, l.name, val)).join('')}</select>`;
  const air = W.tab === 'AIRPORT';
  return `<div class="stack">
   ${air ? `<div class="seg" role="group" aria-label="Direction"><button type="button" class="${W.dir === 'PICKUP' ? 'on' : ''}" data-act="wDir" data-dir="PICKUP" aria-pressed="${W.dir === 'PICKUP'}">Pickup from airport</button><button type="button" class="${W.dir === 'DROP' ? 'on' : ''}" data-act="wDir" data-dir="DROP" aria-pressed="${W.dir === 'DROP'}">Drop to airport</button></div>
     <div class="grid g2 keep2">${W.dir === 'PICKUP'
        ? `<div><label class="f">From</label><div class="fixed-loc">BIA Airport</div></div><div><label class="f" for="w-town">To</label>${sel('town', W.town, nonAir).replace('<select', '<select id="w-town"')}</div>`
        : `<div><label class="f" for="w-town">From</label>${sel('town', W.town, nonAir).replace('<select', '<select id="w-town"')}</div><div><label class="f">To</label><div class="fixed-loc">BIA Airport</div></div>`}</div>`
    : `<div class="grid g2 keep2"><div><label class="f" for="w-from">From</label>${sel('from', W.from, locs, 'Choose').replace('<select', '<select id="w-from"')}</div><div><label class="f" for="w-to">To</label>${sel('to', W.to, locs, 'Choose').replace('<select', '<select id="w-to"')}</div></div>`}
   <div class="grid g2 keep2"><div><label class="f" for="w-date">Date</label><input class="input" type="date" id="w-date" name="date" min="${today()}" value="${esc(W.date)}" data-live="w"></div>
     <div><label class="f" for="w-time">${air && W.dir === 'PICKUP' ? 'Flight lands at' : 'Pickup time'}</label><input class="input" type="time" id="w-time" name="time" value="${esc(W.time)}" data-live="w"></div></div>
   <div><label class="f" for="w-pax">Passengers</label><select class="input" id="w-pax" name="pax" data-live="w">${Array.from({ length: 14 }, (_, i) => opt(i + 1, `${i + 1} ${i ? 'passengers' : 'passenger'}`, W.pax)).join('')}</select></div>
   <button class="btn btn-gold btn-block" data-act="wNext1">See vehicles and prices</button></div>`;
}
function wSummary() {
  const t = wTrip();

}
function wClassStep() {
  const t = wTrip(); const pax = +W.pax;

  }).join('');
  return `<div class="stack">${wSummary()}<h3 style="margin:4px 0 0">Choose a vehicle</h3>${cards}
    ${pax > 12 ? `<div class="warnbox">For more than 12 passengers, please call or WhatsApp us on ${esc(S.settings.company.whatsapp)}.</div>` : ''}</div>`;
}
function wSeatStep() {
  const routes = [...new Set(S.schedules.filter(s => s.active).map(s => s.fromTown + '|' + s.toTown))];
  const st = W.seat; const [from, to] = st.route.split('|');
  const deps = S.schedules.filter(s => s.active && s.fromTown === from && s.toTown === to).sort((a, b) => a.time.localeCompare(b.time));
  const nowT = nowLocal();
  const towns = seatTowns();
  const sch = st.scheduleId && scheduleById(st.scheduleId);
  return `<div class="stack">
    <div><label class="f" for="s-route">Route</label><select class="input" id="s-route" data-live="seat" name="route">${routes.map(r => opt(r, r.replace('|', ' to '), st.route)).join('')}</select></div>

    ${sch ? `<div><span class="f" style="display:block;font-weight:600;font-size:14px;margin-bottom:6px">Pick your seats</span>${seatMapHtml(sch, st.date, st.seats)}</div>
      <div class="summary-line"><span>${st.seats.length ? `Seat${st.seats.length > 1 ? 's' : ''} ${st.seats.join(', ')} · <b>${rs(st.seats.length * S.settings.seatPrice)}</b>` : 'No seats picked yet'}</span><span class="small muted">${rs(S.settings.seatPrice)} per seat</span></div>` : ''}

}
function wDetailsStep() {
  const seat = W.tab === 'SEAT';
  let total = 0, quote = false, summary;

    const st = W.seat, sch = scheduleById(st.scheduleId);
    total = st.seats.length * S.settings.seatPrice;
    summary = `<div class="summary-line"><span><b>${esc(st.on)} to ${esc(st.off)}</b><br>${fmtDay(st.date)}, ${fmtTime(sch.time)} · Seat${st.seats.length > 1 ? 's' : ''} ${st.seats.join(', ')}</span><button class="link" data-act="wStep" data-step="1">Change</button></div>`;
  } else {
    const t = wTrip(); const p = priceFor(t.fromId, t.toId, W.cls); quote = !p; total = p || 0;
    summary = `<div class="summary-line"><span><b>${esc(locName(t.fromId))} to ${esc(locName(t.toId))}</b><br>${fmtDay(W.date)}, ${fmtTime(W.time)} · ${W.pax} pax · ${CLASSES[W.cls].label}</span><button class="link" data-act="wStep" data-step="2">Change</button></div>`;
  }
  const adv = advanceFor(total);
  const priceBox = quote
    ? `<div class="pricebox"><b>We will send you a price.</b><p class="small muted" style="margin:4px 0 0">There is no fixed price for this trip. We will reply on WhatsApp with a price. Nothing to pay now.</p></div>`
    : `<div class="pricebox"><div class="l"><span>Total</span><span class="num">${rs(total)}</span></div><div class="l"><span>Advance (${S.settings.advancePercent}%) to confirm</span><span class="num">${rs(adv)}</span></div><div class="l"><span>Pay the driver on the day</span><span class="num">${rs(total - adv)}</span></div>
       <div style="margin-top:10px"><span class="f" style="display:block;font-weight:600;font-size:14px">How will you pay the advance?</span>
       ${PAYHERE_ENABLED ? `<label class="check"><input type="radio" name="pay" value="CARD"> <span>Pay now by card</span></label>` : ''}
       <label class="check"><input type="radio" name="pay" value="BANK_TRANSFER" checked> <span>Bank transfer<br><span class="small muted">We show our bank details after you book.</span></span></label></div></div>`;
  return `<form class="stack" data-form="book" novalidate>${summary}
    <div><label class="f" for="d-name">Full name</label><input class="input" id="d-name" name="name" autocomplete="name" value="${esc(W.name)}" data-live="w" required></div>
    <div><label class="f" for="d-phone">Phone number</label><input class="input" id="d-phone" name="phone" type="tel" autocomplete="tel" placeholder="077 123 4567 or +974 5555 1234" value="${esc(W.phone)}" data-live="w" required></div>
    <label class="check"><input type="checkbox" name="hasWa" ${W.hasWa ? 'checked' : ''} data-live="w" data-rr="1"> <span>This number has WhatsApp</span></label>
    ${W.hasWa ? '' : `<div><label class="f" for="d-wa">WhatsApp number <span class="opt">(optional)</span></label><input class="input" id="d-wa" name="wa" type="tel" value="${esc(W.wa)}" data-live="w"></div>`}
    <div class="grid g2 keep2"><div><label class="f" for="d-country">Country you live in</label><select class="input" id="d-country" name="country" data-live="w">${COUNTRIES.map(c => opt(c, c, W.country)).join('')}</select></div>
      <div><label class="f" for="d-email">Email <span class="opt">(optional)</span></label><input class="input" id="d-email" name="email" type="email" value="${esc(W.email)}" data-live="w"></div></div>
    <div><label class="f" for="d-notes">${W.tab === 'AIRPORT' ? 'Flight number or notes' : 'Notes'} <span class="opt">(optional)</span></label><textarea class="input" id="d-notes" name="notes" rows="2" data-live="w">${esc(W.notes)}</textarea></div>

function upsertCustomer({ name, phone, wa, country, email }) {

  const now = new Date().toISOString();

    const st = W.seat, sch = scheduleById(st.scheduleId), taken = seatTakenMap(sch.id, st.date);
    if (st.seats.some(n => taken[n])) { st.seats = st.seats.filter(n => !taken[n]); W.step = 1; W.err = 'Sorry, one of your seats was just taken. Please pick again.'; return rerender(); }

    const c = upsertCustomer({ name: d.name, phone, wa, country: d.country, email: d.email });
    const total = st.seats.length * S.settings.seatPrice;
    const sb = { id: uid(), code: nextCode('seat'), token: randToken(), kind: 'SEAT', scheduleId: sch.id, date: st.date, customerId: c.id, contactName: d.name, contactPhone: phone, contactWhatsapp: wa || null,

    fromId: t.fromId, toId: t.toId, pickupAt: W.date + 'T' + W.time, pax, cls, notes: d.notes,
    priceType: price ? 'FIXED' : 'QUOTE', total: price || 0, advance: price ? advanceFor(price) : 0, advanceMethod: price ? (d.pay || 'BANK_TRANSFER') : 'NONE', advancePaidAt: null,
    status: price ? 'NEW' : 'QUOTE_REQUESTED', cancelledReason: null, completedAt: null, assignment: null, createdAt: now };
  S.bookings.push(b); audit('booking.create', 'booking', b.id, `${b.code} ${price ? 'booked' : 'quote requested'} on the website.`); save();

function recordPayment(f, d, { byAdmin }) {

FORM.editPrice = (f, d) => {
  const b = S.bookings.find(x => x.id === f.dataset.id), total = parseInt(d.total, 10), adv = parseInt(d.advance, 10);

  const errors = o ? moneyErrors({ hire, internal, type: s.type, value }) : ['Choose an owner.'];

function ownerInputErrors(d, exceptUserId) {
  const mobile = normPhone(d.mobile), wa = d.whatsapp ? normPhone(d.whatsapp) : mobile, com = parseInt(d.commission, 10);
  if (!d.name) return ['Please enter the name.'];
  if (!phoneOk(mobile)) return ['Please enter a valid mobile number.'];
  if (S.users.some(u => u.phone === mobile && u.id !== exceptUserId)) return ['This mobile number is already used by another account.'];
  if (!phoneOk(wa)) return ['Please check the WhatsApp number.'];
  if (!Number.isInteger(com) || com < 0 || com > 100) return ['Commission must be between 0 and 100.'];
  return [null, { mobile, wa, com }];
}

function approvalMsg(o, kind, status, reason, v) {
  const what = kind === 'owner' ? 'your GoEasy partner account' : `your vehicle ${v.regNo}`;
  if (status === 'APPROVED') return `Hello ${o.name}, good news: ${what} is approved. Sign in here: ${appUrl('partner/login')} – GoEasy Travels`;
  if (status === 'CHANGES_REQUESTED') return `Hello ${o.name}, we checked ${what}. Please make these changes: ${reason}\nThen sign in and press "Send again": ${appUrl('partner/login')} – GoEasy Travels`;
  return `Hello ${o.name}, sorry, ${what} was not approved. Reason: ${reason} – GoEasy Travels`;
}
function setApproval(kind, id, status, reason) {
  let o, v;
  if (kind === 'owner') {
    o = ownerById(id); o.approval = status; o.approvalReason = reason || null;
    if (status === 'APPROVED') ownerVehicles(o.id).filter(x => x.approval === 'PENDING' || x.approval === 'CHANGES_REQUESTED').forEach(x => { x.approval = 'APPROVED'; x.approvalReason = null; });
    audit('owner.' + status.toLowerCase(), 'owner', o.id, `${o.name}: ${STATUS_LABEL[status]}${reason ? ' – ' + reason : ''}.`);
  } else {
    v = vehicleById(id); o = ownerById(v.ownerId); v.approval = status; v.approvalReason = reason || null;
    audit('vehicle.' + status.toLowerCase(), 'vehicle', v.id, `${v.regNo}: ${STATUS_LABEL[status]}${reason ? ' – ' + reason : ''}.`);
  }
  save(); rerender();
  toast(`${kind === 'owner' ? o.name : v.regNo}: ${STATUS_LABEL[status].toLowerCase()}.`, '', { href: waLink(o.whatsapp || o.mobile, approvalMsg(o, kind, status, reason, v)), text: 'Tell owner on WhatsApp' });
}

ACT.rejectItem = async el => { const r = await modal({ title: 'Reject', body: 'The owner sees this reason in their portal.', ok: 'Reject', danger: true, reason: true }); if (r.ok) setApproval(el.dataset.kind, el.dataset.id, 'REJECTED', r.reason); };

function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }

  <form class="card stack" data-form="moneySettings" style="max-width:560px"><h3>Advance and seat price</h3><div class="grid g2">${field('Advance (% of total)', `<input class="input" type="number" min="0" max="100" name="advancePercent" value="${S.settings.advancePercent}">`, 'Rounded to the nearest Rs. 100.')}${field('Sharing van price per seat (Rs.)', `<input class="input" type="number" min="1" name="seatPrice" value="${S.settings.seatPrice}">`)}</div><div><button class="btn">Save</button></div></form></div>`;
}
ACT.clearSample = () => { S.settings.samplePrices = false; save(); rerender(); };
LIVE.priceEdit = (el, e) => {
  if (e.type !== 'change') return; const p = S.prices.find(x => x.id === el.dataset.id), k = el.dataset.k;
  if (k === 'active') p.active = el.checked;
  else { const v = el.value === '' ? null : parseInt(el.value, 10); if (v !== null && (!Number.isInteger(v) || v <= 0)) { toast('Price must be more than 0, or empty for a quote.', 'error'); return; } p[k] = v; }
  audit('price.update', 'price', p.id, `${locName(p.fromId)} – ${locName(p.toId)} ${k} updated.`); save(); toast('Price saved.'); if (k === 'active') rerender();
};
FORM.addRoute = (f, d) => {
  if (d.fromId === d.toId) return toast('From and To must be different.', 'error');
  if (findRoute(d.fromId, d.toId) || S.prices.some(p => (p.fromId === d.fromId && p.toId === d.toId) || (p.fromId === d.toId && p.toId === d.fromId))) return toast('This route already exists. Edit it in the table.', 'error');
  const n = k => d[k] ? parseInt(d[k], 10) : null;
  S.prices.push({ id: uid(), fromId: d.fromId, toId: d.toId, car: n('car'), van: n('van'), kdh: n('kdh'), active: true }); save(); toast('Route added.'); rerender();
};
FORM.moneySettings = (f, d) => {
  const a = parseInt(d.advancePercent, 10), s = parseInt(d.seatPrice, 10);
  if (!Number.isInteger(a) || a < 0 || a > 100) return toast('Advance must be between 0 and 100.', 'error');
  if (!Number.isInteger(s) || s <= 0) return toast('Seat price must be more than 0.', 'error');
  S.settings.advancePercent = a; S.settings.seatPrice = s; audit('settings.update', 'settings', '-', `Advance ${a}%, seat price ${rs(s)}.`); save(); toast('Saved. New bookings use these values.');
};

/* ---------- settings ---------- */
function aSettings() {
  const c = S.settings.company, locs = [...S.locations].sort((a, b) => a.sortOrder - b.sortOrder);
  return `<div class="ph-row"><h1>Settings</h1></div><div class="stack-lg" style="max-width:920px">
  <form class="card stack" data-form="companySettings"><h3>Company details</h3><div class="grid g2">${[['name', 'Company name'], ['brand', 'Brand'], ['reg', 'Registration no.'], ['phone', 'Phone'], ['whatsapp', 'WhatsApp'], ['email', 'Email'], ['website', 'Website'], ['address', 'Address'], ['tagline', 'Tagline']].map(([k, l]) => field(l, `<input class="input" name="${k}" value="${esc(c[k])}">`)).join('')}</div>
    ${field('Bank details shown to customers', `<textarea class="input" name="bankDetails" rows="5">${esc(S.settings.bankDetails)}</textarea>`, 'Placeholder until the client gives the real account.')}
    ${field('Clash window (minutes)', `<input class="input" type="number" min="0" max="1440" name="clashWindow" value="${S.settings.clashWindow}" style="max-width:200px">`, 'Trips closer than this on the same vehicle are blocked.')}
    <div><button class="btn">Save</button></div></form>
  <div class="card"><h3>Locations</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Order</th><th>Name</th><th>Sharing van stop</th><th>Active</th></tr></thead><tbody>
    ${locs.map((l, i) => `<tr class="${l.active ? '' : 'past'}"><td><div class="row" style="gap:4px"><button class="btn btn-ghost btn-sm" data-act="locMove" data-id="${l.id}" data-d="-1" ${i ? '' : 'disabled'} aria-label="Move up">Up</button><button class="btn btn-ghost btn-sm" data-act="locMove" data-id="${l.id}" data-d="1" ${i < locs.length - 1 ? '' : 'disabled'} aria-label="Move down">Down</button></div></td>
      <td><input class="input" value="${esc(l.name)}" data-live="locEdit" data-id="${l.id}" data-k="name" aria-label="Location name">${l.isAirport ? '<span class="small muted">Airport</span>' : ''}</td>
      <td><label class="check" style="padding:0"><input type="checkbox" ${l.isSeatTown ? 'checked' : ''} data-live="locEdit" data-id="${l.id}" data-k="isSeatTown"> <span>Stop</span></label></td>
      <td>${l.isAirport ? '<span class="small muted">Always</span>' : `<label class="check" style="padding:0"><input type="checkbox" ${l.active ? 'checked' : ''} data-live="locEdit" data-id="${l.id}" data-k="active"> <span>Active</span></label>`}</td></tr>`).join('')}</tbody></table></div>
    <form class="row wrapx" data-form="addLocation" style="margin-top:14px;align-items:flex-end">${field('New location', `<input class="input" name="name" required>`)}<label class="check"><input type="checkbox" name="isSeatTown"> <span>Sharing van stop</span></label><button class="btn btn-ghost" style="margin-bottom:2px">Add</button></form></div>
  <form class="card stack" data-form="changePassword"><h3>Admin password</h3><div class="grid g2">${field('Current password', `<input class="input" name="old" type="password" required>`)}<div></div>${field('New password', `<input class="input" name="password" type="password" minlength="8" required>`)}${field('Confirm new password', `<input class="input" name="password2" type="password" required>`)}</div><div><button class="btn btn-ghost">Change password</button></div></form>
  <div class="card"><h3>About this prototype</h3><p class="small muted">Money and clash rules follow the project specification. Self-checks run in the browser console on load. <button class="link" data-act="runChecks">Run checks now</button></p><div id="checks"></div></div></div>`;
}
FORM.companySettings = (f, d) => {
  const cw = parseInt(d.clashWindow, 10); if (!Number.isInteger(cw) || cw < 0) return toast('Clash window must be 0 or more minutes.', 'error');
  ['name', 'brand', 'reg', 'phone', 'whatsapp', 'email', 'website', 'address', 'tagline'].forEach(k => S.settings.company[k] = d[k]);
  S.settings.bankDetails = d.bankDetails; S.settings.clashWindow = cw; audit('settings.update', 'settings', '-', 'Company settings saved.'); save(); toast('Settings saved.');
};
LIVE.locEdit = (el, e) => {
  if (e.type !== 'change') return; const l = loc(el.dataset.id), k = el.dataset.k;
  if (k === 'name') { const n = el.value.trim(); if (!n) return toast('Name cannot be empty.', 'error'); if (S.locations.some(x => x.name.toLowerCase() === n.toLowerCase() && x.id !== l.id)) return toast('This name is already used.', 'error'); const old = l.name; l.name = n; S.schedules.forEach(s => { if (s.fromTown === old) s.fromTown = n; if (s.toTown === old) s.toTown = n; }); }
  else l[k] = el.checked;
  save(); toast('Location saved.'); if (k !== 'name') rerender();
};
ACT.locMove = el => { const locs = [...S.locations].sort((a, b) => a.sortOrder - b.sortOrder), i = locs.findIndex(l => l.id === el.dataset.id), j = i + +el.dataset.d; [locs[i], locs[j]] = [locs[j], locs[i]]; locs.forEach((l, k) => l.sortOrder = k); save(); rerender(); };
FORM.addLocation = (f, d) => {
  if (!d.name) return toast('Please type a name.', 'error'); if (S.locations.some(l => l.name.toLowerCase() === d.name.toLowerCase())) return toast('This location already exists.', 'error');
  S.locations.push({ id: uid(), name: d.name, isAirport: false, isSeatTown: !!d.isSeatTown, sortOrder: S.locations.length, active: true }); save(); toast('Location added.'); rerender();
};
ACT.runChecks = () => { const r = selfTest(); $('#checks').innerHTML = `<ul class="hist">${r.map(([ok, n]) => `<li style="color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? 'Pass' : 'FAIL'}: ${esc(n)}</li>`).join('')}</ul>`; };
</script>
<script>
/* ---------- self-checks (the real app has these as Vitest unit tests) ---------- */
function selfTest() {
  const out = [], eq = (name, a, b) => out.push([JSON.stringify(a) === JSON.stringify(b), name + (JSON.stringify(a) === JSON.stringify(b) ? '' : ` (got ${JSON.stringify(a)}, want ${JSON.stringify(b)})`)]);
  let m = computeMoney({ total: 30000, advance: 7500, hire: 30000, internal: false, type: 'PERCENT', value: 12, mode: 'MIXED' });
  eq('Money: 30,000 / 12% / MIXED', [m.commission, m.ownerShare, m.ownerCollects, m.settlement, m.goeasyEarns], [3600, 26400, 22500, 3900, 3600]);
  m = computeMoney({ total: 34500, advance: 0, hire: 34500, internal: false, type: 'PERCENT', value: 15, mode: 'OWNER_COLLECTS_ALL' });
  eq('Money: 34,500 / 15% / owner collects all', [m.commission, m.ownerShare, m.ownerCollects, m.settlement], [5175, 29325, 34500, -5175]);
  m = computeMoney({ total: 33000, advance: 8300, hire: 33000, internal: true, type: 'PERCENT', value: 0, mode: 'MIXED' });
  eq('Money: own fleet 33,000', [m.settlement, m.goeasyEarns], [0, 33000]);
  m = computeMoney({ total: 30000, advance: 7500, hire: 28000, internal: false, type: 'FIXED', value: 3000, mode: 'GOEASY_COLLECTS_ALL' });
  eq('Money: GoEasy collects all, fixed, margin', [m.ownerCollects, m.goeasyReceives, m.settlement, m.goeasyEarns], [0, 30000, 25000, 5000]);
  eq('Money: fixed commission above hire is an error', moneyErrors({ hire: 1000, internal: false, type: 'FIXED', value: 1001 }).length, 1);
  eq('Phone: 0771234567', normPhone('0771234567'), '94771234567');
  eq('Phone: +974 5555 1234', normPhone('+974 5555 1234'), '97455551234');
  // clash boundary on a throwaway state
  const real = S;
  try {
    S = JSON.parse(JSON.stringify(real)); S.settings.clashWindow = 120;
    const v = S.vehicles.find(x => x.id === 'v-pd3320') || S.vehicles.find(x => !ownerById(x.ownerId)?.isInternal && x.approval === 'APPROVED');
    if (v) {
      const o = ownerById(v.ownerId); o.approval = 'APPROVED'; o.status = 'ACTIVE'; v.availability = 'AVAILABLE'; S.schedules = S.schedules.filter(s => s.vehicleId !== v.id);
      S.bookings = [{ id: 'a', code: 'T-1', status: 'ASSIGNED', pickupAt: '2030-01-10T10:00', assignment: { ownerId: o.id, vehicleId: v.id } }];
      eq('Clash: 119 minutes blocks', clashCheck({ bookingId: 'x', ownerId: o.id, vehicleId: v.id, pickupAt: '2030-01-10T11:59' }).blocks.length, 1);
      eq('Clash: 120 minutes is fine', clashCheck({ bookingId: 'x', ownerId: o.id, vehicleId: v.id, pickupAt: '2030-01-10T12:00' }).blocks.length, 0);
      S.bookings[0].status = 'CANCELLED';
      eq('Clash: cancelled booking ignored', clashCheck({ bookingId: 'x', ownerId: o.id, vehicleId: v.id, pickupAt: '2030-01-10T10:30' }).blocks.length, 0);
    }
  } finally { S = real; }
  return out;
}

/* ---------- start ---------- */
load();
window.addEventListener('hashchange', () => { UI.asg = null; W.err = ''; render(); });
render();
(() => { const r = selfTest(); const bad = r.filter(x => !x[0]); console[bad.length ? 'error' : 'info'](`GoEasy self-checks: ${r.length - bad.length}/${r.length} passed`, bad); })();
</script>
